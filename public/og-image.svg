<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#000000" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#fafafa"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo mark -->
  <rect x="88" y="104" width="72" height="72" rx="20" fill="#18181b"/>
  <g transform="translate(112, 128)" fill="none" stroke="#ffffff" stroke-width="2.2"
